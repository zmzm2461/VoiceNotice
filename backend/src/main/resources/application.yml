server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    stt-path: ${AI_STT_PATH:/stt}
    refine-path: ${AI_REFINE_PATH:/refine}

file:
  upload-dir: ${FILE_UPLOAD_DIR:storage/audio}
